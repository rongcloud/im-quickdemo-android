pluginManagement {
    repositories {
        maven {url "https://maven.rongcloud.cn/repository/maven-releases/"}
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        // AndroidX, Data Binding and Material dependencies are published to Google Maven.
        google()
        maven {url "https://maven.rongcloud.cn/repository/maven-releases/"}
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'im-quickdemo-android'
include ':app'
